services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/bildyapp
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: change_this_secret_with_at_least_32_chars
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 10
      CLOUDINARY_FOLDER: bildyapp
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bildyapp-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bildyapp-network

volumes:
  mongo_data:

networks:
  bildyapp-network:
    driver: bridge
